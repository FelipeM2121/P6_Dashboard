name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/eager-hamilton-GYrFu, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy dashboard to gh-pages
        run: |
          cp p6_dashboard_export.html index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          include_files: index.html
          commit_message: "Auto-deploy dashboard [skip ci]"
